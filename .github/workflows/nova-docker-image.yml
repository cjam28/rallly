name: Nova — Build and Push GHCR Image
# Builds the Rallly fork image for Nova and pushes to GHCR.
# Triggered on pushes to nova/* branches so new features and fixes
# are automatically available as ghcr.io/cjam28/rallly:4-nova.
on:
  push:
    branches:
      - "nova/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cjam28/rallly

jobs:
  build:
    name: Build & Push GHCR Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Fixed tag: ghcr.io/cjam28/rallly:4-nova (updated on every push)
            type=raw,value=4-nova
            # Per-commit tag: ghcr.io/cjam28/rallly:4-nova-<sha>
            type=raw,value=4-nova-{{sha}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SELF_HOSTED=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
